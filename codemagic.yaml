workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: .
    scripts:
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "OlcRTC.xcodeproj" \
            --scheme "OlcRTC" \
            --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
