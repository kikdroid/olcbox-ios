workflows:
  ios-workflow:
    name: iOS Compose Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Prepare Kotlin Framework
        script: |
          set -e
          chmod +x gradlew
          echo "Сборка Kotlin Framework..."
          
          # Эмулируем окружение Xcode для универсальной задачи
          export CONFIGURATION=Release
          export SDK_NAME=iphoneos
          export ARCHS=arm64
          
          # Используем задачу, которая гарантированно существует для iOS-таргетов
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode \
            -x :sharedUI:compileAndroidMain \
            -x :sharedUI:buildOlcrtcAndroidAar \
            -x :androidApp:compileReleaseKotlin \
            --stacktrace
          
      - name: Build Unsigned IPA
        script: |
          set -e
          # Поиск проекта
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          echo "Xcode Build..."
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          echo "Packaging IPA..."
          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_client.ipa Payload
    artifacts:
      - "*.ipa"
