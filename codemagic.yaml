workflows:
  ios-workflow:
    name: iOS Pure Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clean Project
        script: |
          chmod +x gradlew
          # Полная очистка перед стартом
          rm -rf build
          ./gradlew clean
          
      - name: Build Kotlin Framework
        script: |
          set -e
          # 1. Переменные окружения для имитации Xcode
          export CONFIGURATION=Release
          export SDK_NAME=iphoneos
          export ARCHS=arm64
          export PLATFORM_NAME=iphoneos
          
          # 2. Создаем абсолютные пути
          mkdir -p build/xcode_products/SharedUI.framework
          ABS_FRAMEWORK_PATH="$(pwd)/build/xcode_products/SharedUI.framework"
          ABS_BUILD_DIR="$(pwd)/build/xcode_products"
          
          # 3. Экспортируем их (для Gradle задач)
          export BUILT_PRODUCTS_DIR="$ABS_BUILD_DIR"
          export TARGET_BUILD_DIR="$ABS_BUILD_DIR"
          export CONTENTS_FOLDER_PATH="SharedUI.framework"
          export UNLOCALIZED_RESOURCES_FOLDER_PATH="SharedUI.framework"
          
          echo "Сборка фреймворка с принудительным указанием путей..."
          
          # Используем -Pcompose.ios.resources.destDir — это "убивает" проблему создания parent directory,
          # так как мы явно говорим плагину, куда писать.
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode \
            --no-daemon \
            -Pcompose.ios.resources.destDir="$ABS_FRAMEWORK_PATH" \
            -Pkotlin.native.cocoapods.configuration=Release \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs=arm64
          
      - name: Build Xcode Project
        script: |
          set -e
          # Находим путь к iosApp.xcodeproj
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          echo "Запуск xcodebuild..."
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          echo "Упаковка в IPA..."
          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ОШИБКА: .app файл не найден в build-data!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_ios.ipa Payload
    artifacts:
      - "*.ipa"
