workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build ipa
        script: |
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Проект найден по пути: $PROJECT_PATH"
          xcode-project build-ipa \
            --project "$PROJECT_PATH" \
            --scheme "OlcRTC" \
            --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
