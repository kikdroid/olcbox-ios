workflows:
  ios-workflow:
    name: iOS Pure Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clean Project
        script: |
          chmod +x gradlew
          rm -rf build
          ./gradlew clean
          
      - name: Build Kotlin Framework
        script: |
          set -e
          # 1. Готовим пути
          mkdir -p build/xcode_products/SharedUI.framework
          ABS_FRAMEWORK_PATH="$(pwd)/build/xcode_products/SharedUI.framework"
          ABS_BUILD_DIR="$(pwd)/build/xcode_products"
          
          echo "Сборка фреймворка с принудительной передачей параметров..."
          
          # Мы передаем ВСЕ параметры через -P, чтобы обмануть проверку Gradle
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode \
            --no-daemon \
            -Pcompose.ios.resources.destDir="$ABS_FRAMEWORK_PATH" \
            -Pkotlin.native.cocoapods.configuration=Release \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -P@env.SDK_NAME=iphoneos \
            -P@env.CONFIGURATION=Release \
            -P@env.TARGET_BUILD_DIR="$ABS_BUILD_DIR" \
            -P@env.ARCHS=arm64 \
            -P@env.FRAMEWORKS_FOLDER_PATH="Frameworks" \
            -P@env.BUILT_PRODUCTS_DIR="$ABS_BUILD_DIR"
          
      - name: Build Xcode Project
        script: |
          set -e
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          echo "Запуск xcodebuild..."
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          echo "Упаковка в IPA..."
          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ОШИБКА: .app файл не найден!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_ios.ipa Payload
    artifacts:
      - "*.ipa"
