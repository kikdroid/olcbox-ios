workflows:
  ios-workflow:
    name: iOS Pure Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clean Project
        script: |
          chmod +x gradlew
          # Полная очистка, включая удаление папки build вручную
          rm -rf build
          ./gradlew clean
          
      - name: Build Kotlin Framework
        script: |
          set -e
          # Окружение Xcode
          export CONFIGURATION=Release
          export SDK_NAME=iphoneos
          export ARCHS=arm64
          export PLATFORM_NAME=iphoneos
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          
          # Определяем пути
          export XCODE_OUT="$(pwd)/build/xcode_products"
          export CONTENTS_FOLDER_PATH="SharedUI.framework"
          
          # Принудительно создаем дерево папок и даем права
          echo "Принудительная подготовка директорий..."
          mkdir -p "$XCODE_OUT/$CONTENTS_FOLDER_PATH"
          chmod -R 777 "$(pwd)/build"

          # Экспортируем переменные для Gradle
          export TARGET_BUILD_DIR="$XCODE_OUT"
          export BUILT_PRODUCTS_DIR="$XCODE_OUT"
          export UNLOCALIZED_RESOURCES_FOLDER_PATH="$CONTENTS_FOLDER_PATH"
          export FRAMEWORKS_FOLDER_PATH="Frameworks"
          
          echo "Запуск сборки фреймворка..."
          # Добавляем прямой параметр для плагина Compose через -P
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode \
            --no-daemon \
            -Pcompose.ios.resources.destDir="$XCODE_OUT/$CONTENTS_FOLDER_PATH"
          
      - name: Build Xcode Project
        script: |
          set -e
          # Находим проект
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          echo "Запуск xcodebuild..."
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          echo "Упаковка в IPA..."
          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: .app файл не найден!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_ios.ipa Payload
    artifacts:
      - "*.ipa"
