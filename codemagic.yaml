workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build Unsigned IPA
        script: |
          # 1. Заходим в папку с проектом
          cd iosApp
          
          # 2. Собираем .app файл (это займет 3-5 минут)
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          
          # 3. Создаем структуру IPA
          mkdir -p Payload
          # Ищем собранное приложение и копируем его
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          
          # 4. Упаковываем
          zip -qr ../olcbox.ipa Payload
    artifacts:
      - "*.ipa"
