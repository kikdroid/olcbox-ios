workflows:
  ios-workflow:
    name: iOS Pure Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clean Project
        script: |
          chmod +x gradlew
          ./gradlew clean
          
      - name: Build Kotlin Framework
        script: |
          set -e
          export CONFIGURATION=Release
          export SDK_NAME=iphoneos
          export ARCHS=arm64
          export PLATFORM_NAME=iphoneos
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          
          # --- НОВЫЙ БЛОК ---
          # Эмулируем пути Xcode, чтобы Compose Resources знал, куда класть файлы
          export TARGET_BUILD_DIR="$(pwd)/build/xcode_products"
          export BUILT_PRODUCTS_DIR="$(pwd)/build/xcode_products"
          export CONTENTS_FOLDER_PATH="SharedUI.framework"
          export FRAMEWORKS_FOLDER_PATH="Frameworks"
          
          echo "Сборка фреймворка с полным окружением Xcode..."
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
          
      - name: Build Xcode Project
        script: |
          set -e
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_ios.ipa Payload
    artifacts:
      - "*.ipa"
