workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: .
   scripts:
      - name: Build ipa
        script: |
          # Ищем файл проекта автоматически
          PROJECT_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Я нашел проект здесь: $PROJECT_PATH"
          
          # Собираем приложение, используя найденный путь
          xcode-project build-ipa \
            --project "$PROJECT_PATH" \
            --scheme "OlcRTC" \
            --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
