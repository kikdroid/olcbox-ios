workflows:
  ios-workflow:
    name: iOS Compose Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Prepare Kotlin Framework
        script: |
          set -e
          chmod +x gradlew
          echo "Собираем общую логику на Kotlin..."
          # Эта команда подготовит фреймворки, которые ждет Xcode
          ./gradlew :sharedUI:assembleReleaseAppleFrameworkForXcode || ./gradlew assembleRelease
          
      - name: Build Unsigned IPA
        script: |
          set -e
          
          # Ищем, где именно лежит .xcodeproj (на всякий случай)
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          echo "Проект найден в папке: $PROJ_DIR"
          
          cd "$PROJ_DIR"
          
          # Проверяем, не пустой ли файл проекта
          if [ ! -f "iosApp.xcodeproj/project.pbxproj" ]; then
            echo "КРИТИЧЕСКАЯ ОШИБКА: Файл project.pbxproj не найден!"
            exit 1
          fi

          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          # Упаковка
          mkdir -p Payload
          cp -R ./build-data/Build/Products/Release-iphoneos/iosApp.app Payload/
          zip -qr ../olcbox_client.ipa Payload
    artifacts:
      - "*.ipa"
