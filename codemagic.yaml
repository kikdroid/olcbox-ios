workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build Unsigned IPA
        script: |
          # 1. Ищем файл проекта .xcodeproj по всему репозиторию
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          PROJECT_DIR=$(dirname "$PROJECT_PATH")
          echo "Проект найден в: $PROJECT_PATH"
          
          cd "$PROJECT_DIR"

          # 2. Собираем приложение (это ДОЛЖНО занять несколько минут)
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # 3. Ищем, где Xcode спрятал готовый .app
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "iosApp.app" -type d | grep "Release-iphoneos" | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "ОШИБКА: Приложение не собралось!"
            exit 1
          fi

          # 4. Упаковываем в нормальный IPA
          mkdir -p Payload
          cp -R "$APP_DIR" Payload/
          zip -qr olcbox_final.ipa Payload
          
          # Перемещаем в корень для артефактов
          mv olcbox_final.ipa $CM_BUILD_DIR/
    artifacts:
      - "*.ipa"
