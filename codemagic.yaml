workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: .
    scripts:
      - name: Install dependencies
        script: |
          pod install
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "*.xcodeproj" \
            --scheme "olcbox"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - твой_email@gmail.com # Замени на свою почту, чтобы получить файл
