workflows:
  ios-workflow:
    name: iOS Compose Build (No Android)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clean and Prepare
        script: |
          chmod +x gradlew
          ./gradlew clean
          
      - name: Build Kotlin Framework for iOS
        script: |
          set -e
          echo "Собираем только iOS Framework..."
          
          # Указываем переменные для корректной работы embed-задачи
          export CONFIGURATION=Release
          export SDK_NAME=iphoneos
          export ARCHS=arm64
          
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode
          
      - name: Build Unsigned IPA
        script: |
          set -e
          # Находим проект iosApp
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          echo "Запуск Xcodebuild..."
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          # Упаковка в IPA
          echo "Создание IPA архива..."
          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Ошибка: .app файл не найден!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_client_ios.ipa Payload
          echo "Готово!"
    artifacts:
      - "*.ipa"
