workflows:
  ios-workflow:
    name: iOS Pure Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Clean Project
        script: |
          chmod +x gradlew
          rm -rf build
          ./gradlew clean
          
      - name: Build Kotlin Framework
        script: |
          set -e
          # 1. Создаем пути заранее
          ABS_BUILD_DIR="$(pwd)/build/xcode_products"
          ABS_FRAMEWORK_PATH="$ABS_BUILD_DIR/SharedUI.framework"
          mkdir -p "$ABS_FRAMEWORK_PATH"
          
          echo "Сборка фреймворка с форсированными свойствами проекта..."
          
          # Мы передаем свойства ТРЕМЯ способами: 
          # 1. Как обычные -P (для Compose)
          # 2. Как -P@env (для Kotlin Native)
          # 3. Через экспорт (для системных вызовов)
          
          export ARCHS="arm64"
          export SDK_NAME="iphoneos"
          export CONFIGURATION="Release"
          
          ./gradlew :sharedUI:embedAndSignAppleFrameworkForXcode \
            --no-daemon \
            -Pcompose.ios.resources.destDir="$ABS_FRAMEWORK_PATH" \
            -PARCHS="$ARCHS" \
            -PSDK_NAME="$SDK_NAME" \
            -PCONFIGURATION="$CONFIGURATION" \
            -P@env.ARCHS="$ARCHS" \
            -P@env.SDK_NAME="$SDK_NAME" \
            -P@env.CONFIGURATION="$CONFIGURATION" \
            -P@env.TARGET_BUILD_DIR="$ABS_BUILD_DIR" \
            -P@env.BUILT_PRODUCTS_DIR="$ABS_BUILD_DIR" \
            -P@env.FRAMEWORKS_FOLDER_PATH="Frameworks" \
            -Pkotlin.native.cocoapods.platform=iphoneos \
            -Pkotlin.native.cocoapods.archs=arm64 \
            -Pkotlin.native.cocoapods.configuration=Release
          
      - name: Build Xcode Project
        script: |
          set -e
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"

          echo "Запуск xcodebuild..."
          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          echo "Упаковка в IPA..."
          mkdir -p Payload
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ОШИБКА: .app файл не найден!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_ios.ipa Payload
    artifacts:
      - "*.ipa"
