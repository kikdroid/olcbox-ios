workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Build IPA
        script: |
          # Автоматическая сборка без подписи
          xcode-project build-ipa \
            --workspace $(find . -name "*.xcworkspace" | head -n 1) \
            --scheme "iosApp" \
            --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
