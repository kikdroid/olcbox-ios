workflows:
  ios-workflow:
    name: iOS Compose Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
      xcode: latest
    scripts:
      - name: Prepare Kotlin Framework
        script: |
          set -e
          chmod +x gradlew
          echo "Собираем только iOS Framework (Release) и отключаем Android-задачи..."
          
          # Мы принудительно исключаем (-x) все задачи, которые лезут в Android 
          # и требуют отсутствующую папку 'olcrtc-original'
          ./gradlew :sharedUI:assembleSharedUIReleaseFrameworkIosArm64 \
            -x :sharedUI:compileAndroidMain \
            -x :sharedUI:buildOlcrtcAndroidAar \
            -x :androidApp:compileReleaseKotlin \
            -x :androidApp:mergeReleaseResources
          
      - name: Build Unsigned IPA
        script: |
          set -e
          
          # Автоматически находим, где лежит iosApp.xcodeproj
          PROJ_PATH=$(find . -name "iosApp.xcodeproj" -type d | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "ОШИБКА: Проект iosApp.xcodeproj не найден!"
            exit 1
          fi
          
          PROJ_DIR=$(dirname "$PROJ_PATH")
          cd "$PROJ_DIR"
          echo "Собираем Xcode проект в папке: $(pwd)"

          xcodebuild build \
            -project "iosApp.xcodeproj" \
            -scheme "iosApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ./build-data

          # Создаем структуру для IPA
          echo "Упаковываем результат..."
          mkdir -p Payload
          
          # Ищем скомпилированное приложение .app внутри build-data
          APP_PATH=$(find ./build-data -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ОШИБКА: Файл .app не найден. Сборка Xcode провалилась."
            exit 1
          fi
          
          cp -R "$APP_PATH" Payload/
          zip -qr ../olcbox_client.ipa Payload
          echo "Билд успешно завершен!"
    artifacts:
      - "*.ipa"
